name: Release Windows app

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$packageVersion") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $packageVersion."
          }

      - name: Test
        run: pnpm test

      - name: Read previous ZIP baseline
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $previousJson = gh release view --json tagName,assets
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read previous Release.' }
          $previous = $previousJson | ConvertFrom-Json
          if ($previous.assets.name -contains 'update.json') {
            gh release download $previous.tagName --pattern update.json --dir release-previous
            if ($LASTEXITCODE -ne 0) { throw 'Cannot download previous ZIP manifest.' }
          }

      - name: Build Windows ZIP and incremental update
        run: pnpm run build:win

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $indexPath = 'release/artifacts/update.json'
          $index = Get-Content $indexPath -Raw | ConvertFrom-Json
          $artifacts = @($indexPath, "release/artifacts/$($index.full.name)")
          foreach ($delta in $index.deltas) { $artifacts += "release/artifacts/$($delta.name)" }
          gh release create $env:GITHUB_REF_NAME `
            @artifacts `
            --title "Ashes of Pantheon QA Tool $env:GITHUB_REF_NAME" `
            --notes 'Download the win-x64.zip, extract it to a writable folder, then run the EXE inside. No installer. The app downloads file-level delta updates when the previous ZIP baseline matches, otherwise a full ZIP. Version 0.1.3 and older single-file builds require one manual migration to ZIP.' `
            --generate-notes `
            --verify-tag
          if ($LASTEXITCODE -ne 0) { throw 'Release publish failed.' }
